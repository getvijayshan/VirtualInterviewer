# HTTP-only server block (used until a certificate exists, or when no domain
# is configured). setup_vm.sh replaces __SERVER_NAME__ with DOMAIN_NAME, or "_".
# See candidate-true-companion-ssl.conf for the HTTPS variant.

server {
    listen 80;
    server_name __SERVER_NAME__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/candidate-true-companion-locations.conf;
}
