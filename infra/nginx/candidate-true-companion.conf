# Reverse proxy for the Candidate True Companion FastAPI backend.
# The API itself binds 127.0.0.1:8000 only (see the systemd unit) — this is
# the only thing the NSG's allow-http/allow-https rules actually expose.
# No TLS cert wired up here yet (Phase 1) — add one (e.g. certbot) once a
# real domain points at the VM's public IP.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
