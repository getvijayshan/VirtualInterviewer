# Shared by the HTTP and HTTPS server blocks. One origin serves the UI and the
# API, so the browser needs no CORS and no mixed content.

client_max_body_size 25m;   # resume and audio uploads (nginx default is 1m)

# /api/foo -> FastAPI /foo  (the trailing slashes strip the /api prefix)
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # LLM + speech-to-text calls can be slow
}

# Everything else is the Next.js frontend
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
